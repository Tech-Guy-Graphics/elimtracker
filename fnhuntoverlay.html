    const root = document.querySelector(".overlay"), status = document.querySelector("#status"), title = document.querySelector("#game-title"), standings = document.querySelector("#standings"), feed = document.querySelector("#elimination-feed");

    function clearEliminationBubbles() { eliminationBubbles.forEach(bubble => window.clearTimeout(bubble.timer)); eliminationBubbles.clear(); feed.replaceChildren(); feed.hidden = true; }

        badge.className = `counter-delta ${delta > 0 ? "increase" : "decrease"}`; badge.setAttribute("aria-hidden", "true"); badge.textContent = `${delta > 0 ? "+" : ""}${delta.toLocaleString()}`;

        } else window.setTimeout(() => badge.remove(), 2400);
      }

      const label = document.createElement("span"); label.className = "elims-label"; label.textContent = "elims"; elims.append(label);

      }

    }

    function renderFortniteOverlay(rows) {
      const players = rows.map(numberRow).filter(player => player.name && player.gameUsername).sort(compare);
      const online = players.filter(player => player.active);
      const ownIndex = online.findIndex(player => player.gameUsername.trim().toLocaleLowerCase() === gameUsername.trim().toLocaleLowerCase());
      const visible = online.slice(0, 4);
      if (ownIndex > 3) visible[3] = online[ownIndex];
      const visibleKeys = new Set(visible.map(player => player.gameUsername.trim().toLocaleLowerCase()));
      if (hasLeaderboardSnapshot) {
        players.forEach(player => {
          const key = player.gameUsername.trim().toLocaleLowerCase(), oldValue = previousEliminations.get(key);
          if (!visibleKeys.has(key) && oldValue !== undefined && player.eliminations > oldValue) showEliminationBubble(player, player.eliminations - oldValue);
        });
      }
      const oldTops = new Map();
      standings.querySelectorAll(".entry[data-player-key]").forEach(row => oldTops.set(row.dataset.playerKey, row.getBoundingClientRect().top));
      standings.replaceChildren(...visible.map((player, index) => makeFortniteOverlayEntry(player, index, previousEliminations.get(player.gameUsername.trim().toLocaleLowerCase()))));
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        standings.querySelectorAll(".entry[data-player-key]").forEach(row => {
          const oldTop = oldTops.get(row.dataset.playerKey);
          if (oldTop === undefined) return;
          const delta = oldTop - row.getBoundingClientRect().top;
          if (Math.abs(delta) > 1) row.animate([{ transform: `translateY(${delta}px)` }, { transform: "translateY(0)" }], { duration: 520, easing: "cubic-bezier(.2,.75,.25,1)" });
        });
      }
      previousPlaces = new Map(online.map((player, index) => [player.gameUsername.trim().toLocaleLowerCase(), { place: player.placement || index + 1, top: 0 }]));
      standings.querySelectorAll(".entry[data-player-key]").forEach(row => { const entry = previousPlaces.get(row.dataset.playerKey); if (entry) entry.top = row.getBoundingClientRect().top; });

      if (!visible.length) showError("No Fortnite players are currently online.");
      else showOverlay();
    }

    let huntStartTime = NaN, huntFoundAt = 0, huntFound = false;
    function updateUptime() { const timer = document.querySelector("#uptime-timer"); if (!Number.isFinite(huntStartTime)) { timer.textContent = "--:--:--"; return; } const endTime = huntFound && huntFoundAt ? huntFoundAt : Date.now(), elapsed = Math.max(0, Math.floor((endTime - huntStartTime) / 1000)), hours = Math.floor(elapsed / 3600), minutes = Math.floor(elapsed % 3600 / 60), seconds = elapsed % 60; timer.textContent = `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`; }
    function renderHuntItems(rows) { const list = document.querySelector("#hunt-items"), found = number(rows?.[0]?.[9]) === 1, nextItems = new Map(); huntFound = found; if (found && !huntFoundAt) huntFoundAt = Date.now(); if (!found) huntFoundAt = 0; document.querySelector("#hunt-meta").classList.toggle("complete", found); document.querySelector("#hunt-found-message").hidden = !found; list.replaceChildren(); (rows || []).forEach((row, index) => { const imageUrl = String(row[8] ?? "").trim(), quantity = number(row[9]); if (quantity < 1 || !/^https:\/\//i.test(imageUrl)) return; const key = `${index}:${imageUrl}`, previousQuantity = previousHuntItems.get(key), isNew = hasHuntItemSnapshot && previousQuantity === undefined, increased = hasHuntItemSnapshot && previousQuantity !== undefined && quantity > previousQuantity, item = document.createElement("div"); item.className = `hunt-item${found && index === 0 ? " one-piece" : ""}`; const image = document.createElement("img"); image.src = imageUrl; image.alt = "Treasure item"; image.referrerPolicy = "no-referrer"; const count = document.createElement("span"); count.className = "hunt-item-count"; count.textContent = `×${quantity}`; item.append(image, count); list.append(item); if (!matchMedia("(prefers-reduced-motion: reduce)").matches) { if (isNew) item.animate([{ opacity: 0, transform: "translateY(8px) scale(.9)" }, { opacity: 1, transform: "translateY(0) scale(1)" }], { duration: 420, easing: "cubic-bezier(.2,.75,.25,1)" }); if (increased) count.animate([{ color: "#fff3ce", transform: "scale(1)" }, { color: "#fff0a8", transform: "scale(1.35)" }, { color: "#fff3ce", transform: "scale(1)" }], { duration: 650, easing: "ease-out" }); } nextItems.set(key, quantity); }); previousHuntItems.clear(); nextItems.forEach((quantity, key) => previousHuntItems.set(key, quantity)); hasHuntItemSnapshot = true; }
    window.setInterval(updateUptime, 1000);

    function attachLeaderboard(id) {
      if (unsubscribeLeaderboard) unsubscribeLeaderboard();
      leaderboardId = String(id || "");
      if (!leaderboardId) { showError("The Fortnite leaderboard is not available yet."); return; }
      unsubscribeLeaderboard = onValue(ref(database, `leaderboards/${leaderboardId}`), snapshot => {
        const rows = normalizeRows(snapshot.val());
        renderHuntItems(rows);
        renderFortniteOverlay(rows);
      }, error => showError(`Could not load the leaderboard: ${error.message}`));
    }

    async function verifyFortniteOverlay() {
      if (!uid) { showError("Add your Firebase UID to the overlay URL as ?uid=YOUR_UID."); return; }
      try {
        const userSnap = await get(ref(database, `users/${uid}`));
        if (!userSnap.exists()) { showError("This account is not approved for the leaderboard."); return; }
        const accounts = userSnap.val().gameAccounts || {};
        const fnKey = Object.keys(accounts).find(k => k.trim().toLowerCase() === "fortnite");
        const linkedUsername = fnKey ? String(accounts[fnKey]).trim() : "";
        if (!linkedUsername) { showError("Your account is not linked to Fortnite."); return; }

        const boardsSnap = await get(ref(database, "leaderboards"));
        const boards = boardsSnap.exists() ? boardsSnap.val() : {};
        const found = Object.entries(boards).find(([, b]) => String(b.name || "").trim().toLowerCase() === "fortnite");
        if (!found) { showError('The "Fortnite" leaderboard was not found in Firebase.'); return; }

        gameUsername = linkedUsername;
        attachLeaderboard(found[0]);
      } catch (err) {
        showError(`Overlay verification failed: ${err.message}`);
      }
    }

    function handleFortniteSession(session) {
      if (!session) { showError("Waiting for the session data to sync."); return; }
      const hunt = session.fortnite || {}, wins = number(hunt.wins), losses = number(hunt.losses), nextStart = easternTimestamp(hunt.startTime);

      huntStartTime = nextStart; updateUptime();
      title.textContent = "Pirate Token Hunt"; title.title = "Pirate Token Hunt";

      if (activeGame !== "Fortnite") {
        activeGame = "Fortnite";
        gameUsername = "";
        hasLeaderboardSnapshot = false;
        previousEliminations.clear();
        previousPlaces.clear();
        clearEliminationBubbles();
        showError("Checking overlay access for Fortnite…");
        verifyFortniteOverlay();
      }
    }

    function connect() {
      const app = initializeApp(FIREBASE_CONFIG);
      database = getDatabase(app, FIREBASE_CONFIG.databaseURL);
      unsubscribeSession = onValue(ref(database, "session"), snapshot => handleFortniteSession(snapshot.val()), error => showError(`Could not load session stats: ${error.message}`));
    }

    connect();
  </script>

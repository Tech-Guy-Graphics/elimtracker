<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pirate Token Hunt Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--paper:#f3f6fa;--muted:#aab5c4;--line:#ffffff2b;--accent:#f0c65b;--display:"Barlow Condensed",Impact,sans-serif;--body:"DM Sans","Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{padding:12px;margin:0;color:var(--paper);font:14px var(--body);background:transparent}
    .overlay{width:min(100%,780px);margin:0 auto;filter:drop-shadow(0 5px 14px #0008)}
    .heading{padding:12px 16px;border:1px solid var(--accent);background:#1a140ceF;border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .game-title{font:800 26px var(--display);color:#f4d57e;margin:0;text-transform:uppercase}
    .timer{font:800 24px var(--display);color:#f3f6fa;font-variant-numeric:tabular-nums}
    .standings{border:1px solid #ffffff20;border-top:0;border-radius:0 0 6px 6px;overflow:hidden}
    .entry{display:grid;grid-template-columns:54px 1fr 110px;align-items:center;padding:8px 16px;border-top:1px solid #ffffff20;background:#17140fe8}
    .entry:first-child{border-top:0}
    .you-tag{margin-left:8px;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
    .status{padding:12px 16px;border:1px solid var(--accent);border-radius:6px;background:#1a140ceF;color:var(--muted)}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="overlay" id="overlay-root">
    <header class="heading">
      <h1 class="game-title">Pirate Token Hunt</h1>
      <div class="timer" id="uptime-timer">--:--:--</div>
    </header>
    <section class="standings" id="standings"></section>
  </main>
  <p class="status" id="status" hidden></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, onValue, ref } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const db = getDatabase(initializeApp({ databaseURL: "https://kill-tracker-e3083-default-rtdb.firebaseio.com/" }));

    const urlParams = new URLSearchParams(window.location.search);
    const discordParam = (urlParams.get("discordId") || urlParams.get("discord") || "").trim().replace(/^discord_/i, "");
    const rawIdParam = (urlParams.get("uid") || urlParams.get("id") || "").trim();
    const isDiscordSnowflake = /^\d{17,20}$/.test(rawIdParam) || /^discord_\d+$/i.test(rawIdParam);
    const discordId = discordParam || (isDiscordSnowflake ? rawIdParam.replace(/^discord_/i, "") : "");
    const uid = discordId ? "" : rawIdParam;

    let usersCache = {};
    let latestRows = [];
    let huntStartTimeStr = "";

    const esc = (v) => String(v ?? "").replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");

    function resolveUserFromFirebase() {
      const list = Object.values(usersCache || {});
      if (discordId) {
        return list.find(u => String(u?.discordId || "").trim() === discordId) || null;
      }
      if (uid) {
        return usersCache[uid] || list.find(u => u?.uid === uid || u?.authUid === uid) || null;
      }
      return null;
    }

    function getFortniteUsernameForUser(userRec) {
      if (!userRec || !userRec.gameAccounts) return "";
      const match = Object.entries(userRec.gameAccounts).find(
        ([g]) => g.trim().toLowerCase() === "fortnite"
      );
      return match ? String(match[1] || "").trim().toLowerCase() : "";
    }

    function parseEtStartTime(str) {
      const m = String(str || "").trim().match(/^(\d{2}):(\d{2}):(\d{2})\s+(\d{2})\/(\d{2})\/(\d{2})$/);
      if (!m) return null;
      const [, hh, mm, ss, dd, mo, yy] = m;
      const year = 2000 + Number(yy);
      // Approximate Eastern Time offset (-05:00 EST / -04:00 EDT)
      const utcGuess = Date.UTC(year, Number(mo) - 1, Number(dd), Number(hh) + 5, Number(mm), Number(ss));
      return utcGuess;
    }

    setInterval(() => {
      const timerEl = document.querySelector("#uptime-timer");
      if (!huntStartTimeStr) {
        timerEl.textContent = "--:--:--";
        return;
      }
      const startMs = parseEtStartTime(huntStartTimeStr);
      if (!startMs) {
        timerEl.textContent = huntStartTimeStr;
        return;
      }
      const diffSec = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
      const h = String(Math.floor(diffSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSec % 3600) / 60)).padStart(2, "0");
      const s = String(diffSec % 60).padStart(2, "0");
      timerEl.textContent = `${h}:${m}:${s}`;
    }, 1000);

    function renderStandings() {
      const root = document.querySelector("#overlay-root");
      const statusEl = document.querySelector("#status");

      let ownFortniteUser = "";
      if (discordId || uid) {
        const matchedUser = resolveUserFromFirebase();
        if (!matchedUser && Object.keys(usersCache).length > 0) {
          root.hidden = true;
          statusEl.textContent = "User ID / Discord ID is not linked to an approved account.";
          statusEl.hidden = false;
          return;
        }
        ownFortniteUser = getFortniteUsernameForUser(matchedUser);
      }

      root.hidden = false;
      statusEl.hidden = true;

      const sorted = [...latestRows]
        .filter(r => r && (r[2] || r[3]))
        .sort((a, b) => (Number(a[6]) || 999) - (Number(b[6]) || 999) || (Number(b[1]) || 0) - (Number(a[1]) || 0));

      const ownIdx = ownFortniteUser
        ? sorted.findIndex(r => String(r[3] || "").trim().toLowerCase() === ownFortniteUser)
        : -1;

      const visible = sorted.slice(0, 4);
      if (ownIdx > 3) visible[3] = sorted[ownIdx];

      const standings = document.querySelector("#standings");
      standings.replaceChildren(...visible.map((r, idx) => {
        const isYou = ownFortniteUser && String(r[3] || "").trim().toLowerCase() === ownFortniteUser;
        const div = document.createElement("article");
        div.className = "entry";
        div.innerHTML = `
          <span style="font-size:24px;font-family:var(--display);font-weight:800;color:#f0c85c">${Number(r[6]) || idx + 1}</span>
          <div><strong>${esc(r[2])}</strong>${isYou ? '<span class="you-tag">You</span>' : ""}</div>
          <span style="text-align:right;font-size:20px;font-family:var(--display);font-weight:800;color:#f0c85c">${(Number(r[1]) || 0).toLocaleString()} elims</span>
        `;
        return div;
      }));
    }

    onValue(ref(db, "users"), (snap) => {
      usersCache = snap.exists() ? snap.val() : {};
      renderStandings();
    });

    onValue(ref(db, "session/fortnite"), (snap) => {
      const fn = snap.val() || {};
      huntStartTimeStr = String(fn.startTime || "").trim();
      if (!huntStartTimeStr) {
        document.querySelector("#uptime-timer").textContent = "--:--:--";
      }
    });

    onValue(ref(db, "leaderboards"), (snap) => {
      const boards = snap.val() || {};
      const fn = Object.values(boards).find(b => String(b.name || "").trim().toLowerCase() === "fortnite");
      if (!fn) return;
      latestRows = Array.isArray(fn.rows) ? fn.rows : [];
      renderStandings();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--paper:#f3f6fa;--muted:#aab5c4;--line:#ffffff2b;--accent:#79e0ba;--display:"Barlow Condensed",Impact,sans-serif;--body:"DM Sans","Segoe UI",sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;min-width:320px;min-height:100%;margin:0;background:transparent}
    body{padding:12px;color:var(--paper);font:14px var(--body);-webkit-font-smoothing:antialiased}
    .overlay{width:min(100%,780px);margin:0 auto;filter:drop-shadow(0 5px 14px #0008)}
    .heading{display:flex;min-height:48px;align-items:center;justify-content:space-between;gap:20px;padding:6px 16px;border:1px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0;background:#111923e8}
    .game-title{min-width:0;margin:0;overflow:hidden;font:800 26px/1 var(--display);text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
    .record{display:flex;flex:0 0 auto;align-items:center;gap:16px}
    .record-stat{display:grid;grid-template-columns:16px auto;align-items:center;gap:8px;font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
    .record-stat span:first-child{color:var(--muted);font:inherit;letter-spacing:1px}
    .record-stat.wins .counter-counter{color:#64e69b}
    .record-stat.losses .counter-counter{color:#ff766e}
    .standings{overflow:hidden;border:0;border-radius:0;background:transparent}
    .entry{display:grid;min-height:62px;grid-template-columns:54px minmax(0,1.5fr) minmax(100px,.8fr) 92px;align-items:center;column-gap:12px;padding:7px 16px;border-top:1px solid #ffffff20;transition:background .2s}
    .entry:first-child{border-top:0}
    .entry[data-place="1"]{--medal:#f0c85c;--wash:#f0c85c24}
    .entry[data-place="2"]{--medal:#d4dde8;--wash:#d4dde81a}
    .entry[data-place="3"]{--medal:#df9b72;--wash:#df9b721c}
    .entry[data-place]{background:linear-gradient(90deg,var(--wash),transparent 85%);box-shadow:inset 3px 0 var(--medal)}
    .rank{color:var(--muted);font:800 27px/1 var(--display);font-variant-numeric:tabular-nums}
    .entry[data-place] .rank,.entry[data-place] .elims{color:var(--medal)}
    .player{display:flex;min-width:0;align-items:center;gap:10px}
    .avatar{display:grid;width:38px;height:38px;flex:0 0 38px;place-items:center;overflow:hidden;border:1px solid #ffffff32;border-radius:2px;background:#ffffff12;color:var(--accent);font:800 16px var(--display);text-transform:uppercase}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .name{overflow:hidden;font-size:13px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
    .you{margin-left:6px;color:var(--accent);font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
    .slot-column,.elims{display:flex;min-width:0;flex-direction:column;gap:3px}
    .character{overflow:hidden;color:#d2dae4;font-size:12px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
    .slot-label,.elims-label{color:var(--muted);font:700 8px/1 var(--body);letter-spacing:.8px;text-transform:uppercase}
    .elims{align-items:flex-end;justify-content:center;color:var(--accent);font:800 23px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
    .elims-label{font-size:8px}
    .elimination-feed{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding-top:9px}
    .elimination-bubble{display:flex;min-height:48px;max-width:min(100%,420px);align-items:center;gap:10px;padding:5px 7px 5px 6px;border:1px solid #ffffff38;border-radius:4px;background:#111923e8;box-shadow:0 4px 14px #0006;animation:bubble-in .24s cubic-bezier(.2,.75,.25,1) both}

    .bubble-initial{display:grid;place-items:center;background:#ffffff12;color:var(--accent);font:800 16px var(--display)}
    .bubble-name{min-width:0;overflow:hidden;font-size:12px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
    .bubble-count{display:grid;width:36px;height:36px;flex:0 0 36px;place-items:center;margin-left:4px;border:1px solid #ffffff44;border-radius:50%;background:#ffffff12;color:#64e69b;font:800 16px/1 var(--display);font-variant-numeric:tabular-nums}
    .elimination-feed[hidden]{display:none}
    @keyframes bubble-in{from{opacity:0;transform:translateY(7px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .status{margin:0;padding:12px 16px;border:1px solid var(--line);border-radius:3px;background:#111923e8;color:var(--muted);font-size:12px}
    .status[hidden]{display:none}
    .counter-counter{display:inline-flex;align-items:center;gap:0;direction:ltr;line-height:1;vertical-align:middle}
    .counter-digit{position:relative;display:inline-block;width:.55em;height:1em;overflow:hidden;font-variant-numeric:tabular-nums;vertical-align:top}
    .counter-number{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;width:100%;height:100%;line-height:1;will-change:transform}
    .counter-separator{display:inline-block;width:.22em;text-align:center;vertical-align:top;line-height:1}
    .counter-digit[hidden],.counter-separator[hidden]{display:none}
    @media(max-width:520px){body{padding:7px}.heading{min-height:52px;padding:8px 11px}.game-title{font-size:22px}.record{gap:10px}.record-stat{grid-template-columns:12px auto;gap:5px;font-size:24px}.record-stat span:first-child{font-size:9px}.entry{min-height:56px;grid-template-columns:39px minmax(0,1.4fr) minmax(68px,.8fr) 66px;column-gap:7px;padding:6px 10px}.rank{font-size:23px}.avatar{width:32px;height:32px;flex-basis:32px}.player{gap:7px}.name{font-size:11px}.character{font-size:10px}.slot-label,.elims-label{font-size:7px}.elims{font-size:20px}.elimination-bubble{min-height:43px}.elimination-bubble img,.bubble-initial,.bubble-count{width:32px;height:32px;flex-basis:32px}}
    @media(max-width:520px){body{padding:7px}.heading{min-height:52px;padding:8px 11px}.game-title{font-size:22px}.record{gap:10px}.record-stat{grid-template-columns:12px auto;gap:5px;font-size:24px}.record-stat span:first-child{font-size:9px}.entry{min-height:56px;grid-template-columns:39px minmax(0,1.4fr) minmax(68px,.8fr) 66px;column-gap:7px;padding:6px 10px}.rank{font-size:23px}.avatar{width:32px;height:32px;flex-basis:32px}.player{gap:7px}.name{font-size:11px}.character{font-size:10px}.slot-label,.elims-label{font-size:7px}.elims{font-size:20px}.elimination-bubble{min-height:43px}.elimination-bubble img,.bubble-initial,.bubble-count{width:32px;height:32px;flex-basis:32px}}
    @media(max-width:520px){.heading{min-height:44px;padding:5px 11px}.record-stat span:first-child{font-size:24px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>

    function showEliminationBubble(player,delta){const key=player.gameUsername.trim().toLocaleLowerCase();let bubble=eliminationBubbles.get(key);if(!bubble){const element=document.createElement("div");element.className="elimination-bubble";element.setAttribute("role","status");const initial=document.createElement("span");initial.className="bubble-initial";initial.textContent=player.name.slice(0,1)||"?";element.append(initial);try{const imageUrl=new URL(player.image);if(imageUrl.protocol==="https:"){const image=document.createElement("img");image.src=imageUrl.href;image.alt="";image.referrerPolicy="no-referrer";image.addEventListener("load",()=>initial.remove(),{once:true});element.replaceChild(image,initial)}}catch{}const name=document.createElement("span");name.className="bubble-name";name.textContent=player.name||"Unnamed player";const count=document.createElement("span");count.className="bubble-count";element.append(name,count);bubble={element,count,total:0,timer:0};eliminationBubbles.set(key,bubble);feed.append(element);feed.hidden=false}else{bubble.element.querySelector(".bubble-name").textContent=player.name||"Unnamed player"}bubble.total+=delta;bubble.count.textContent=`+${bubble.total}`;if(!matchMedia("(prefers-reduced-motion: reduce)").matches){bubble.element.animate([{transform:"scale(1)"},{transform:"scale(1.04)",offset:.45},{transform:"scale(1)"}],{duration:320,easing:"ease-out"})}window.clearTimeout(bubble.timer);bubble.timer=window.setTimeout(()=>{if(eliminationBubbles.get(key)!==bubble)return;bubble.element.animate([{opacity:1,transform:"translateY(0)"},{opacity:0,transform:"translateY(5px)"}],{duration:180,easing:"ease-in"}).onfinish=()=>{if(eliminationBubbles.get(key)!==bubble)return;bubble.element.remove();eliminationBubbles.delete(key);feed.hidden=eliminationBubbles.size===0}},5000)}
    function makeOverlayEntry(player,index,previousValue){const row=document.createElement("article"),place=player.placement||index+1,key=player.gameUsername.trim().toLocaleLowerCase();row.className="entry";row.dataset.place=String(Math.min(place,3));row.dataset.playerKey=key;const rank=document.createElement("span");rank.className="rank";rank.textContent=String(place);const playerBox=document.createElement("div");playerBox.className="player";const avatar=document.createElement("div");avatar.className="avatar";const initial=document.createElement("span");initial.textContent=player.name.slice(0,1)||"?";avatar.append(initial);try{const imageUrl=new URL(player.image);if(imageUrl.protocol==="https:"){const image=document.createElement("img");image.src=imageUrl.href;image.alt="";image.referrerPolicy="no-referrer";image.addEventListener("load",()=>initial.remove(),{once:true});avatar.append(image)}}catch{}const name=document.createElement("span");name.className="name";name.textContent=player.name||"Unnamed player";playerBox.append(avatar,name);if(key===gameUsername.trim().toLocaleLowerCase()){const you=document.createElement("span");you.className="you";you.textContent="You";name.append(you)}const characterColumn=document.createElement("div");characterColumn.className="slot-column";const character=document.createElement("span");character.className="character";character.textContent=player.character||"—";character.title=player.character||"Character";const characterLabel=document.createElement("span");characterLabel.className="slot-label";characterLabel.textContent="Character";characterColumn.append(character,characterLabel);const elims=document.createElement("div");elims.className="elims";elims.setAttribute("aria-label",`${player.eliminations.toLocaleString()} eliminations`);const count=document.createElement("span");count.setAttribute("aria-hidden","true");buildCounter(count,previousValue??0,player.eliminations);const label=document.createElement("span");label.className="elims-label";label.textContent="Elims";elims.append(count,label);animateCounter(count,previousValue??0,player.eliminations);row.append(rank,playerBox,characterColumn,elims);const old=previousPlaces.get(key);if(old&&old.place!==place&&!matchMedia("(prefers-reduced-motion: reduce)").matches){rank.animate([{transform:"scale(1)"},{transform:"scale(1.2)",offset:.45},{transform:"scale(1)"}],{duration:520,easing:"ease-out"});row.animate([{filter:"brightness(1)"},{filter:"brightness(1.5)",offset:.35},{filter:"brightness(1)"}],{duration:680,easing:"ease-out"})}return row}
    function renderOverlay(rows){const players=rows.map(numberRow).filter(player=>player.name&&player.gameUsername).sort(compare),ownIndex=players.findIndex(player=>player.gameUsername.trim().toLocaleLowerCase()===gameUsername.trim().toLocaleLowerCase()),visible=players.slice(0,3);if(ownIndex>2)visible[2]=players[ownIndex];const visibleKeys=new Set(visible.map(player=>player.gameUsername.trim().toLocaleLowerCase()));if(hasLeaderboardSnapshot)players.forEach(player=>{const key=player.gameUsername.trim().toLocaleLowerCase(),oldValue=previousEliminations.get(key);if(!visibleKeys.has(key)&&oldValue!==undefined&&player.eliminations>oldValue)showEliminationBubble(player,player.eliminations-oldValue)});const oldTops=new Map();standings.querySelectorAll(".entry[data-player-key]").forEach(row=>oldTops.set(row.dataset.playerKey,row.getBoundingClientRect().top));standings.replaceChildren(...visible.map((player,index)=>makeOverlayEntry(player,index,previousEliminations.get(player.gameUsername.trim().toLocaleLowerCase()))));if(!matchMedia("(prefers-reduced-motion: reduce)").matches)standings.querySelectorAll(".entry[data-player-key]").forEach(row=>{const oldTop=oldTops.get(row.dataset.playerKey);if(oldTop===undefined)return;const delta=oldTop-row.getBoundingClientRect().top;if(Math.abs(delta)>1)row.animate([{transform:`translateY(${delta}px)`},{transform:"translateY(0)"}],{duration:520,easing:"cubic-bezier(.2,.75,.25,1)"})});previousPlaces=new Map(players.map((player,index)=>[player.gameUsername.trim().toLocaleLowerCase(),{place:player.placement||index+1,top:0}]));standings.querySelectorAll(".entry[data-player-key]").forEach(row=>{const entry=previousPlaces.get(row.dataset.playerKey);if(entry)entry.top=row.getBoundingClientRect().top});previousEliminations=new Map(players.map(player=>[player.gameUsername.trim().toLocaleLowerCase(),player.eliminations]));hasLeaderboardSnapshot=true;if(!players.length)showError("No leaderboard players are available for the active game.");else showOverlay()}
    function handleOverlaySession(session){if(!session){showError("Waiting for the session sheet to sync.");return}updateRecord(document.querySelector("#session-wins"),number(session.wins),previousWins,"win");updateRecord(document.querySelector("#session-losses"),number(session.losses),previousLosses,"loss");previousWins=number(session.wins);previousLosses=number(session.losses);const nextTitle=String(session.gameTitle||"").trim();title.textContent=nextTitle||"No active game";title.title=nextTitle;if(nextTitle!==activeGame){activeGame=nextTitle;gameUsername="";hasLeaderboardSnapshot=false;previousEliminations.clear();previousPlaces.clear();clearEliminationBubbles();if(!activeGame){showError("No active game is set in Session!E2.");return}showError("Checking overlay access for the active game…");const id=crypto.randomUUID();pending.set(id,{gameTitle:activeGame,gameSheetId:session.gameSheetId});sendAccessRequest(id)}else if(gameUsername&&String(session.gameSheetId||"")!==leaderboardId)attachLeaderboard(session.gameSheetId)}
    makeEntry=makeOverlayEntry;render=renderOverlay;handleSession=handleOverlaySession;
    const bridgeUrl=new URL(CONFIG.accessBridgeUrl);bridgeUrl.searchParams.set("channel",channel);bridge.src=bridgeUrl.href;connect();
  </script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17120a">
  <title>Pirate Token Hunt</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--ink:#17120a;--panel:#261e0f;--soft:#3b2c14;--line:#725b2a;--paper:#fff3ce;--muted:#c5b88e;--lime:#e9b64d;--green:#e9b64d;--blue:#b57712;--display:"Barlow Condensed",Impact,sans-serif;--body:"DM Sans","Segoe UI",sans-serif}
    *{box-sizing:border-box}body{min-width:320px;margin:0;background-color:var(--ink);background-image:radial-gradient(ellipse at 90% 0%,#d6941838,transparent 35%),repeating-linear-gradient(135deg,transparent 0 34px,#ffffff03 34px 35px);color:var(--paper);font:14px var(--body)}
    .page{width:min(1120px,calc(100% - 40px));margin:auto}
    .topbar{min-height:62px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand img{width:34px;height:34px}
    .hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding:58px 0 35px}
    h1{margin:0;font:900 clamp(56px,9vw,92px)/.85 var(--display);text-transform:uppercase;color:#f3c75e;background:linear-gradient(110deg,#fff1ad 0%,#f3c75e 52%,#c77d16 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .session-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:18px;border:1px solid var(--line);background:var(--panel)}.session-stat{padding:14px 18px}.session-stat+.session-stat{border-left:1px solid var(--line)}.session-stat-label{display:block;margin-bottom:5px;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase}.session-stat-value{display:block;color:var(--lime);font:800 28px/1 var(--display)}
    .treasure-board{margin-bottom:18px;border:1px solid var(--line);background:var(--panel)}.treasure-toolbar{padding:12px 16px;border-bottom:1px solid var(--line)}.treasure-list{display:flex;flex-wrap:wrap;gap:13px;padding:14px 16px}.treasure-item{display:grid;width:72px;justify-items:center;gap:6px}.treasure-icon{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 3px 8px #0008)}.treasure-quantity{color:var(--paper);font:800 15px/1 var(--display)}
    .board{border:1px solid var(--line);background:var(--panel);padding:20px}
    .entry{display:grid;grid-template-columns:66px minmax(190px,1.6fr) 120px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
    .rank{font:800 24px var(--display);color:var(--muted)}.elims{font:800 25px var(--display);color:var(--lime);text-align:right}
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><a href="index.html"><img src="icon.png" alt=""></a></div>
      <nav style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <a href="index.html" style="color:var(--paper);font-weight:700;text-decoration:none">Leaderboard</a>
        <a href="privacy.html" style="color:var(--paper);font-weight:700;text-decoration:none">Privacy Policy</a>
      </nav>
    </header>
    <main>
      <section class="hero">
        <div><h1>Pirate Token<br>Hunt</h1><p>Track the crew and treasure discovered in Firebase.</p></div>
      </section>
      <section class="session-stats">
        <div class="session-stat"><span class="session-stat-label">Fortnite Eliminations</span><strong class="session-stat-value" id="session-elims">--</strong></div>
        <div class="session-stat"><span class="session-stat-label">Fortnite Wins</span><strong class="session-stat-value" id="session-wins">--</strong></div>
        <div class="session-stat"><span class="session-stat-label">Fortnite Losses</span><strong class="session-stat-value" id="session-losses">--</strong></div>
      </section>
      <section class="treasure-board">
        <div class="treasure-toolbar"><h2>Treasure Found</h2></div>
        <div class="treasure-list" id="treasure-list"><span id="treasure-empty" style="color:var(--muted)">No treasure found yet.</span></div>
      </section>
      <section class="board">
        <h2>Fortnite Standings</h2>
        <div id="leaderboard"></div>
      </section>
    </main>
    <footer style="padding:18px 0 28px;border-top:1px solid var(--line);color:var(--muted);font-size:11px">
      <a href="privacy.html" style="color:var(--muted);text-underline-offset:3px">Privacy Policy</a>
    </footer>
  </div>
  <script type="module">
    import { db, ref, onValue } from "./firebase-bridge.js";

    onValue(ref(db, "session"), (snap) => {
      const data = snap.val() || {};
      const fn = data.fortnite || {};
      document.querySelector("#session-elims").textContent = Number(fn.eliminations) || 0;
      document.querySelector("#session-wins").textContent = Number(fn.wins) || 0;
      document.querySelector("#session-losses").textContent = Number(fn.losses) || 0;
    });

    onValue(ref(db, "leaderboards"), (snap) => {
      const boards = snap.val() || {};
      const fnBoard = Object.values(boards).find(b => String(b.name || "").trim().toLowerCase() === "fortnite");
      if (!fnBoard) return;

      const rows = fnBoard.rows || [];
      const tList = document.querySelector("#treasure-list");
      tList.replaceChildren();
      let hasTreasure = false;

      rows.forEach(r => {
        const iconUrl = String(r[8] || "").trim();
        const qty = Number(r[9]) || 0;
        if (qty > 0 && /^https:\/\//i.test(iconUrl)) {
          hasTreasure = true;
          const item = document.createElement("div");
          item.className = "treasure-item";
          item.innerHTML = `<img class="treasure-icon" src="${iconUrl}" alt=""><span class="treasure-quantity">×${qty}</span>`;
          tList.append(item);
        }
      });
      document.querySelector("#treasure-empty").style.display = hasTreasure ? "none" : "block";

      const boardEl = document.querySelector("#leaderboard");
      boardEl.replaceChildren(...rows.map((r, idx) => {
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `
          <span class="rank">${r[6] || idx + 1}</span>
          <div style="display:flex;align-items:center;gap:10px">
            <img src="${r[0]}" style="width:36px;height:36px;border-radius:3px;object-fit:cover" onerror="this.style.display='none'" alt="">
            <div><strong>${r[2]}</strong><br><small style="color:var(--muted)">${r[3]}</small></div>
          </div>
          <div class="elims">${r[1]}</div>
        `;
        return div;
      }));
    });
  </script>
</body>
</html>
